name: Build Release

on:
  workflow_call:
    inputs:
      version:
        description: "Package label baked into the archive (e.g. dev-<sha> or v20260721)"
        required: true
        type: string
      ref:
        description: "Git ref to check out. Defaults to `version` for tag builds; the dev path passes a real SHA."
        required: false
        type: string
      documentation:
        description: "Build and attach the data-model PDF. Only worth the extra minutes on a real release; dev builds skip it."
        required: false
        default: false
        type: boolean
    outputs:
      archive:
        description: "The release archive filename"
        value: ${{ jobs.build.outputs.archive }}
      documentation:
        description: "The data-model documentation PDF filename"
        value: ${{ jobs.build.outputs.documentation }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:13
    outputs:
      archive: ${{ steps.archive.outputs.ARCHIVE }}
      documentation: ${{ steps.documentation.outputs.PDF }}

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git curl unzip nodejs npm php php-cli php-curl php-mbstring php-xml php-zip composer

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Build the requested ref, not the triggering ref. On a dispatched
          # run the triggering ref is the branch, which would otherwise package
          # current main under the tag's name. `version` is only a label baked
          # into the archive and may not be a real ref (e.g. dev-<sha>), so
          # tag builds fall back to it while the dev path passes a SHA.
          ref: ${{ inputs.ref || inputs.version }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Create release package
        run: just release "${{ inputs.version }}"

      - name: Find release archive
        id: archive
        run: |
          ARCHIVE=$(ls openvwr-*.tar.gz | head -n 1)
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_OUTPUT
          echo "NAME=${ARCHIVE%.tar.gz}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.NAME }}
          path: ${{ steps.archive.outputs.ARCHIVE }}
          retention-days: 7

      # De datamodel-documentatie wordt uit de formulierdefinities gegenereerd,
      # zodat de PDF bij een release altijd de werkelijke velden beschrijft.
      # De LaTeX-toolchain kost een paar minuten, dus dit gebeurt alleen bij een
      # echte release en niet bij elke dev-build.
      - name: Install documentation toolchain
        if: inputs.documentation
        run: |
          # php-sqlite3: de generator bouwt de formulieren op tegen een lege
          # SQLite in het geheugen, zodat er geen database nodig is.
          apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended \
            librsvg2-bin fonts-dejavu php-sqlite3

      - name: Build data-model documentation
        if: inputs.documentation
        env:
          # DejaVu zit in de container; Helvetica Neue is macOS-only.
          DOC_MAINFONT: DejaVu Sans
          DOC_MONOFONT: DejaVu Sans Mono
        run: ./docs/build-pdf.sh

      - name: Name the documentation after the release
        id: documentation
        if: inputs.documentation
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PDF="openvwr-datamodel-${VERSION}.pdf"
          cp docs/gegevensmodel-verwerkingen.pdf "$PDF"
          echo "PDF=${PDF}" >> "$GITHUB_OUTPUT"
          echo "NAME=${PDF%.pdf}" >> "$GITHUB_OUTPUT"

      - name: Upload documentation
        if: inputs.documentation
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.documentation.outputs.NAME }}
          path: ${{ steps.documentation.outputs.PDF }}
          retention-days: 7
