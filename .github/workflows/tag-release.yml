name: Tag Release

on:
  workflow_dispatch:
    inputs:
      alpha:
        description: 'Mark as alpha release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          if [ "${{ inputs.alpha }}" = "true" ]; then
            VERSION=$(./scripts/generate-version-tag.sh --alpha)
          else
            VERSION=$(./scripts/generate-version-tag.sh)
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "### Release Tagged :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "**Alpha:** ${{ inputs.alpha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build and publish jobs will now package and release this version." >> $GITHUB_STEP_SUMMARY

  # Build and publish inline rather than relying on the tag push to trigger
  # release.yml: tags pushed with GITHUB_TOKEN do not fire `on: push` events,
  # so a chained trigger would never run.
  build:
    needs: tag
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
      documentation: true

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: openvwr-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          files: |
            *.tar.gz
            *.pdf
          generate_release_notes: true
