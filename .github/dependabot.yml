version: 2

updates:
  # CMS npm dependencies
  - package-ecosystem: "npm"
    directory: "/src/cms"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(cms)"
    labels:
      - "dependencies"
      - "npm"

  # Static website npm dependencies
  - package-ecosystem: "npm"
    directory: "/src/static-website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(static-website)"
    labels:
      - "dependencies"
      - "npm"

  # CMS composer dependencies
  - package-ecosystem: "composer"
    directory: "/src/cms"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    # Majors are proposed too, but ungrouped: one breaking major in a
    # grouped PR would otherwise block every other update in it.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(cms)"
    labels:
      - "dependencies"
      - "composer"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/src/cms"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
      - "github-actions"
