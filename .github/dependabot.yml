version: 2

# Daily, with a cooldown: a new version must be published for N days
# before Dependabot proposes it, so malicious or broken releases are
# usually retracted or flagged first. Security updates skip the cooldown.
# dependabot-auto-merge.yml enables auto-merge for patch and minor only;
# a human approval is still required by the ruleset.

updates:
  # CMS npm dependencies
  - package-ecosystem: "npm"
    directory: "/src/cms"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(cms)"
    labels:
      - "dependencies"
      - "npm"

  # Static website npm dependencies
  - package-ecosystem: "npm"
    directory: "/src/static-website"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(static-website)"
    labels:
      - "dependencies"
      - "npm"

  # CMS composer dependencies
  - package-ecosystem: "composer"
    directory: "/src/cms"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 3
      semver-major-days: 7
    # Majors are proposed too, but ungrouped: one breaking major in a
    # grouped PR would otherwise block every other update in it.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(cms)"
    labels:
      - "dependencies"
      - "composer"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/src/cms"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
      - "github-actions"
