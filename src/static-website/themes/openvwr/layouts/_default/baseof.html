<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection `ltr` }}" class="h-full">
<head>
  {{ partial "head.html" . }}
</head>
<body class="flex flex-col h-full">
  {{ partial "header.html" . }}

  <main tabindex="-1" class="grow">
      {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ block "footer-files" . }}{{ end }}
</body>
</html>
