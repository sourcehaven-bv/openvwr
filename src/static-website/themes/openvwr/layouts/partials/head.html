<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>

{{ with site.Params.description }}
<meta name="description" content="{{ . }}">
{{ end }}

{{ $options := dict "targetPath" "css/main.css" "outputStyle" "compressed" }}
{{ $styles := resources.Get "main.scss" | resources.ToCSS $options | fingerprint }}

<link rel="stylesheet" href="{{ $styles.Permalink | relURL }}" integrity="{{ $styles.Data.Integrity }}">
