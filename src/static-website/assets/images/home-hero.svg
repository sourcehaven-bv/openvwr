<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 200" width="1920" height="200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>

    <!-- Pattern for subtle texture -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="200" fill="url(#heroGradient)"/>
  <rect width="1920" height="200" fill="url(#grid)"/>

  <!-- Abstract geometric shapes representing data/records -->
  <g opacity="0.15">
    <!-- Document icons -->
    <path d="M 200 50 L 200 130 L 280 130 L 280 70 L 260 50 Z M 260 50 L 260 70 L 280 70"
          fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
    <line x1="215" y1="85" x2="265" y2="85" stroke="white" stroke-width="2"/>
    <line x1="215" y1="100" x2="265" y2="100" stroke="white" stroke-width="2"/>
    <line x1="215" y1="115" x2="245" y2="115" stroke="white" stroke-width="2"/>

    <path d="M 350 60 L 350 140 L 430 140 L 430 80 L 410 60 Z M 410 60 L 410 80 L 430 80"
          fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
    <line x1="365" y1="95" x2="415" y2="95" stroke="white" stroke-width="2"/>
    <line x1="365" y1="110" x2="415" y2="110" stroke="white" stroke-width="2"/>
    <line x1="365" y1="125" x2="395" y2="125" stroke="white" stroke-width="2"/>

    <!-- Database/server icons -->
    <ellipse cx="1600" cy="75" rx="60" ry="20" fill="none" stroke="white" stroke-width="3"/>
    <rect x="1540" y="75" width="120" height="60" fill="none" stroke="white" stroke-width="3"/>
    <ellipse cx="1600" cy="135" rx="60" ry="20" fill="none" stroke="white" stroke-width="3"/>
    <line x1="1540" y1="100" x2="1660" y2="100" stroke="white" stroke-width="2"/>
    <line x1="1540" y1="115" x2="1660" y2="115" stroke="white" stroke-width="2"/>

    <!-- Connection lines -->
    <path d="M 280 90 Q 315 90 350 90" fill="none" stroke="white" stroke-width="2" stroke-dasharray="5,5"/>
    <path d="M 430 100 Q 1015 100 1540 105" fill="none" stroke="white" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- Optional: Add text overlay area on the left -->
  <rect x="0" y="0" width="600" height="200" fill="rgba(0,0,0,0.2)"/>
</svg>
