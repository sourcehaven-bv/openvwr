<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 192" width="300" height="192">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="orgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="192" fill="url(#orgGradient)"/>

  <!-- Building/Organization icon -->
  <g transform="translate(150, 96)">
    <!-- Building outline -->
    <rect x="-40" y="-50" width="80" height="70" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>

    <!-- Windows -->
    <rect x="-30" y="-40" width="12" height="12" fill="white" opacity="0.6"/>
    <rect x="-12" y="-40" width="12" height="12" fill="white" opacity="0.6"/>
    <rect x="6" y="-40" width="12" height="12" fill="white" opacity="0.6"/>

    <rect x="-30" y="-20" width="12" height="12" fill="white" opacity="0.6"/>
    <rect x="-12" y="-20" width="12" height="12" fill="white" opacity="0.6"/>
    <rect x="6" y="-20" width="12" height="12" fill="white" opacity="0.6"/>

    <!-- Door -->
    <rect x="-10" y="0" width="20" height="20" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Optional: Organization text placeholder -->
  <text x="150" y="160" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.8">
    Organisatie
  </text>
</svg>
