languageCode: nl-NL
title: Verwerkingsregister
theme: openvwr
markup:
  goldmark:
    renderer:
      unsafe: false
outputs:
  home:
    - HTML
    - JSON
params:
  debug: false
  darkMode: true
  defaultTheme: auto
security:
  node:
    permissions:
      # Tailwind 4 loads native addons (lightningcss, oxide) through PostCSS.
      allowaddons:
        - postcss
        - tailwindcss
