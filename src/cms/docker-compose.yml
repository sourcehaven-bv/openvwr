services:
    web:
        image: sail-8.4-hugo/app
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: ../../../../../Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            WWWGROUP: '${WWWGROUP}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            COMPOSER_ROOT_VERSION: 'dev-develop'
        volumes:
            - '.:/var/www/html'
            - '../static-website:/var/www/html/static-website'
            - '../../.db_requirements:/var/www/html/storage/app/sql-generation-management/.db_requirements'
        networks:
            - sail
        depends_on:
            - pgsql
            - clamav

    pgsql:
        image: 'postgres:15'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    clamav:
        image: 'clamav/clamav'
        networks:
            - sail
        platform: 'linux/amd64'

    static-website:
        image: 'nginx:alpine'
        ports:
            - '${STATIC_WEBSITE_PORT:-8080}:80'
        volumes:
            - './storage/app/static-website:/usr/share/nginx/html:ro'
            - './docker/nginx/static-website.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - sail
        depends_on:
            - web

    # Object storage is opt-in, so minio sits behind a profile and does not start
    # with a plain `sail up`. Bring it up with `--profile object-storage`, or use
    # `just minio-up`, and set FILESYSTEM_SHARED_DRIVER=s3 to actually use it.
    minio:
        profiles: ['object-storage']
        # Chainguard's build: MinIO no longer serves public pulls from Docker Hub
        # or quay.io. Chainguard only offers `latest` for free, so pin the digest.
        # Its entrypoint is already `minio`, and it runs as a non-root user by
        # default, which cannot write to the root-owned volume.
        image: 'cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9'
        ports:
            - '${MINIO_PORT:-9000}:9000'
            - '${MINIO_CONSOLE_PORT:-9001}:9001'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minioadmin}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-minioadmin}'
        user: root
        volumes:
            - 'sail-minio:/minio_root'
        networks:
            - sail
        command: server /minio_root --console-address ":9001"
        healthcheck:
            test: [ "CMD", "mc", "ready", "local" ]
            interval: 10s
            timeout: 5s
            retries: 5

    minio-setup:
        profiles: ['object-storage']
        image: sail-8.4-hugo/app
        depends_on:
            minio:
                condition: service_healthy
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                php artisan storage:setup-buckets
                exit 0

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-minio:
        driver: local
